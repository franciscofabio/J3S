<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Segurança eletrônica</title>
  <desc id="desc">Cena abstrata premium com monitoramento, proteção e infraestrutura de segurança.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="55%" stop-color="#07111d"/>
      <stop offset="100%" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1f7bf2"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="250" cy="150" r="140" fill="#38bdf8" opacity="0.1" filter="url(#blur)"/>
  <circle cx="980" cy="580" r="220" fill="#1f7bf2" opacity="0.12" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <rect x="190" y="150" width="820" height="500" rx="34" fill="url(#screen)" stroke="#204060" stroke-width="2"/>
    <rect x="230" y="195" width="200" height="130" rx="22" fill="#09111d" stroke="#274b74" stroke-width="1"/>
    <rect x="455" y="195" width="300" height="130" rx="22" fill="#09111d" stroke="#274b74" stroke-width="1"/>
    <rect x="780" y="195" width="190" height="130" rx="22" fill="#09111d" stroke="#274b74" stroke-width="1"/>
    <rect x="230" y="350" width="740" height="260" rx="26" fill="#08111d" stroke="#274b74" stroke-width="1"/>
  </g>
  <g opacity="0.92">
    <circle cx="330" cy="260" r="44" fill="url(#accent)"/>
    <circle cx="330" cy="260" r="18" fill="#020617"/>
    <path d="M310 258h40" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
    <path d="M330 238v44" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g opacity="0.85">
    <path d="M500 245h220" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round"/>
    <path d="M500 275h180" stroke="#1f7bf2" stroke-width="8" stroke-linecap="round"/>
    <path d="M500 305h120" stroke="#14b8a6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="820" cy="260" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <path d="M808 260l10 10 18-24" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="290" y="398" width="620" height="220" rx="26" fill="#09111d" stroke="#274b74" stroke-width="1"/>
    <rect x="320" y="430" width="160" height="18" rx="9" fill="#0f172a"/>
    <rect x="320" y="468" width="250" height="18" rx="9" fill="#0f172a"/>
    <rect x="320" y="506" width="210" height="18" rx="9" fill="#0f172a"/>
    <rect x="320" y="544" width="300" height="18" rx="9" fill="#0f172a"/>
    <circle cx="790" cy="500" r="56" fill="#38bdf8" opacity="0.16"/>
    <circle cx="790" cy="500" r="34" fill="#1f7bf2"/>
    <circle cx="790" cy="500" r="16" fill="#020617"/>
  </g>
</svg>
