<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Infraestrutura de fibra óptica</title>
  <desc id="desc">Cena abstrata premium de rede óptica com cabos iluminados e painéis técnicos.</desc>
  <defs>
